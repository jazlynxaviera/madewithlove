<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Made with Love - Contact & Testimoni</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .font-script { font-family: 'Great Vibes', cursive; }
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-100 via-pink-50 to-white text-slate-700 min-h-screen flex flex-col justify-between">

  <!-- Navigation Bar -->
  <nav class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="font-script text-2xl font-bold text-pink-600">Made with Love</div>
      <ul class="flex items-center gap-5 text-xs font-semibold text-pink-700">
        <li><a href="index.html" class="hover:text-pink-500 transition-colors">Home</a></li>
        <li><a href="katalog.html" class="hover:text-pink-500 transition-colors">Catalogue</a></li>
        <li><a href="contact.html" class="text-pink-500 font-bold underline decoration-2 underline-offset-4">Contact & Testi</a></li>
      </ul>
    </div>
  </nav>

  <!-- Section Contact & Testimoni -->
  <section class="max-w-md mx-auto px-4 py-8 my-auto w-full space-y-6">
    
    <!-- Tombol Contact Admin -->
    <div class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl border border-pink-200 shadow-xl text-center">
      <h2 class="font-script text-4xl text-pink-500 mb-4">Contact Us</h2>
      <div class="space-y-3">
        <a href="https://wa.me/6287760352779" target="_blank" class="block w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-2xl text-xs transition-all shadow-md shadow-green-100">
          WhatsApp Admin 💬
        </a>
        <a href="https://t.me/xavieyi" target="_blank" class="block w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 rounded-2xl text-xs transition-all shadow-md shadow-sky-100">
          Telegram Admin (@xavieyi) ✈️
        </a>
      </div>
    </div>

    <!-- Form Input Testimoni -->
    <div class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl border border-pink-200 shadow-xl">
      <div class="text-center mb-4">
        <h3 class="font-script text-3xl text-pink-500">Kirim Testimoni</h3>
        <p class="text-[11px] text-slate-400 mt-1">Tulis pesan/kesan kamu, akan langsung muncul secara otomatis ♡</p>
      </div>

      <form id="krisarForm" class="space-y-3">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama / Username</label>
          <input type="text" id="krisarNama" placeholder="Contoh: alifaah" required class="w-full bg-pink-50/50 border border-pink-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-400 text-slate-700">
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Pesan / Testimoni</label>
          <textarea id="krisarPesan" rows="3" placeholder="Contoh: 10000/10 trustedd guyss" required class="w-full bg-pink-50/50 border border-pink-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pink-400 text-slate-700 resize-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-semibold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-pink-200">
          Posting Krisar 💌
        </button>
      </form>
    </div>

    <!-- Container Tempat Pesan Muncul Permanen secara Realtime -->
    <div class="space-y-3">
      <h3 class="font-script text-3xl text-pink-500 text-center">Kritik dan Saran ♡</h3>
      <div id="krisarList" class="space-y-3">
        <p class="text-center text-xs text-slate-400 py-4">Memuat pesan...</p>
      </div>
    </div>

  </section>

  <footer class="text-center py-4 text-[10px] text-pink-400 font-medium">
    Made with Love - By Xaviera ♡
  </footer>

  <script>
    // =============================================================
    // TEMPEL LINK GOOGLE APPS SCRIPT KAMU DI DALAM TANDA PETIK DI BAWAH INI:
    // =============================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQEIx_c-Z36nnmIEnTcPxLx_STiVJx1ELygIgESqIWu0h--7cc3uXr8YQeZ_zGNFVg/exec";

    async function loadTestimoni() {
      const container = document.getElementById('krisarList');
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const list = await response.json();
        
        container.innerHTML = '';
        if (list.length === 0) {
          container.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">Belum ada testimoni. Jadilah yang pertama! ♡</p>';
          return;
        }

        list.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-white/40 backdrop-blur-md p-4 rounded-2xl border border-pink-200/80 shadow-sm text-slate-700 relative transition-all hover:bg-white/60";
          card.innerHTML = `
            <div class="text-[11px] font-bold text-pink-600 mb-1">♡ ﹒🍥 ﹕ Krisar ﹒₊ ✩</div>
            <p class="text-xs font-medium text-slate-700">𐙚 • <b>Dari:</b> ${escapeHtml(item.nama)}</p>
            <p class="text-xs font-medium text-slate-700 mt-0.5">𐙚 • <b>Pesan:</b> ${escapeHtml(item.pesan)}</p>
            <span class="text-[9px] text-pink-400 block text-right mt-1 font-medium">${item.tanggal}</span>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p class="text-center text-xs text-pink-400 py-4">Gagal memuat testimoni. Pastikan URL Google Script sudah benar.</p>';
      }
    }

    document.getElementById('krisarForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const nama = document.getElementById('krisarNama').value.trim();
      const pesan = document.getElementById('krisarPesan').value.trim();
      const btn = document.getElementById('submitBtn');

      if (!nama || !pesan) return;

      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const now = new Date();
      const tanggalFormat = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ nama, pesan, tanggal: tanggalFormat })
        });

        document.getElementById('krisarForm').reset();
        await loadTestimoni();
      } catch (err) {
        alert("Gagal memposting testimoni. Coba lagi ya!");
      } finally {
        btn.disabled = false;
        btn.innerText = "Posting Krisar 💌";
      }
    });

    function escapeHtml(text) {
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadTestimoni();
  </script>

</body>
</html>
