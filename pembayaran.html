<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Made with Love - Pembayaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .font-script { font-family: 'Great Vibes', cursive; }
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-pink-100 via-pink-50 to-white text-slate-700 min-h-screen flex flex-col justify-between">

  <!-- Navigation Bar -->
  <nav class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="font-script text-2xl font-bold text-pink-600">Made with Love</div>
      <ul class="flex items-center gap-5 text-xs font-semibold text-pink-700">
        <li><a href="index.html" class="hover:text-pink-500 transition-colors">Home</a></li>
        <li><a href="katalog.html" class="hover:text-pink-500 transition-colors">Catalogue</a></li>
        <li><a href="contact.html" class="hover:text-pink-500 transition-colors">Contact & Krisar</a></li>
      </ul>
    </div>
  </nav>

  <!-- Payment Section -->
  <section class="max-w-md mx-auto px-4 py-8 my-auto w-full">
    <div class="bg-white/90 backdrop-blur-sm p-6 sm:p-8 rounded-3xl border border-pink-200 shadow-xl text-center">
      <h2 class="font-bold text-pink-600 text-base mb-1">Pembayaran via QRIS</h2>
      <p class="text-[11px] text-slate-400 mb-4">Scan kode QRIS berikut untuk membayar:</p>

      <div class="bg-pink-50/60 p-3 rounded-2xl border border-pink-200 mb-4 text-left">
        <p class="text-[10px] text-slate-400 font-medium">Pesanan Kamu:</p>
        <p id="displayProduct" class="text-xs font-bold text-pink-600 mt-0.5">Memuat...</p>
      </div>

      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-4">
        <img src="qris.jpg" alt="QRIS Pembayaran" class="w-48 h-48 mx-auto object-cover rounded-xl shadow-inner">
      </div>

      <button id="waBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-2xl text-xs shadow-md shadow-green-100 transition-all flex items-center justify-center gap-2">
        <span>Kirim Bukti Pembayaran via WhatsApp</span> 💬
      </button>

      <a href="katalog.html" class="block text-center text-[11px] text-slate-400 hover:text-pink-500 mt-4 transition-colors">
        ← Kembali ke Katalog
      </a>
    </div>
  </section>

  <footer class="text-center py-4 text-[10px] text-pink-400 font-medium">
    Made with Love - By Xaviera ♡
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedProduct = urlParams.get('product') || 'Aplikasi Premium';
    document.getElementById('displayProduct').innerText = selectedProduct;

    document.getElementById('waBtn').addEventListener('click', () => {
      const nomorAdmin = "6287760352779";
      const pesan = `♡ ﹒🍥 ﹕ 𝓯ormat order app premium ﹒₊ ✩\n𐙚 • Aplikasi : ${selectedProduct}\n\nHalo Admin, saya sudah bayar via QRIS! Berikut saya lampirkan bukti transfernya 💖`;
      window.open(`https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`, '_blank');
    });
  </script>
</body>
</html>
